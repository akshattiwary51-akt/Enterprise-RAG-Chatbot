[pytest]
testpaths = tests
pythonpath = .
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
# tests/legacy/ is an older suite with its own conftest.py (different fixtures and corpus). Two modules
# named `conftest` cannot be imported in one pytest process, so it is excluded here and run on its own:
#     pytest tests/legacy -o addopts=""        (scripts/run_tests.sh runs both suites)
# Both suites are reported separately; see docs/TESTING.md.
addopts = --ignore=tests/legacy
